    restart: always
    ports:
      - "27028:27018"
    networks:
      - mongodb-network
    volumes:
      - shard1b-data:/data/db
    command:
      [
        "--shardsvr",
        "--replSet",
        "shard1ReplSet",
        "--bind_ip_all",
