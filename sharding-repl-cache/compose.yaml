services:
 
  configSrv1:
    image: mongo:latest
    container_name: configSrv1
    restart: always
    ports:
      - "27017:27017"
    networks:
      - mongodb-network
    volumes:
      - config1-data:/data/db
    command:
      [
        "--configsvr",
        "--replSet",
        "configReplSet",
        "--bind_ip_all",
        "--port",
        "27017",
        "--setParameter",
        "logicalSessionRefreshMillis=5000",
        "--setParameter",
        "transactionLifetimeLimitSeconds=300",
        "--setParameter",
        "disableLogicalSessionCacheRefresh=false"
      ]
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')", "--port", "27017"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

  configSrv2:
    image: mongo:latest
    container_name: configSrv2
    restart: always
    ports:
      - "27027:27017"
    networks:
      - mongodb-network
    volumes:
      - config2-data:/data/db
    command:
      [
        "--configsvr",
        "--replSet",
        "configReplSet",
        "--bind_ip_all",
        "--port",
        "27017",
        "--setParameter",
        "logicalSessionRefreshMillis=5000",
        "--setParameter",
        "transactionLifetimeLimitSeconds=300",
        "--setParameter",
        "disableLogicalSessionCacheRefresh=false"
      ]
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')", "--port", "27017"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

  configSrv3:
    image: mongo:latest
    container_name: configSrv3
    restart: always
    ports:
      - "27037:27017"
    networks:
      - mongodb-network
    volumes:
      - config3-data:/data/db
    command:
      [
        "--configsvr",
        "--replSet",
        "configReplSet",
        "--bind_ip_all",
        "--port",
        "27017",
        "--setParameter",
        "logicalSessionRefreshMillis=5000",
        "--setParameter",
