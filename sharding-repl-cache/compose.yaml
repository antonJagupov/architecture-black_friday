    ports:
      - "27038:27018"
    networks:
      - mongodb-network
    volumes:
      - shard1c-data:/data/db
    command:
      [
        "--shardsvr",
        "--replSet",
        "shard1ReplSet",
        "--bind_ip_all",
        "--port",
        "27018",
        "--setParameter",
        "logicalSessionRefreshMillis=5000",
        "--setParameter",
        "transactionLifetimeLimitSeconds=300",
        "--setParameter",
