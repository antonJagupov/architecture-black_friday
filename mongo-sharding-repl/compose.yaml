services:
 
  configSrv1:
    image: mongo:latest
    container_name: configSrv1
    restart: always
    ports:
      - "27017:27017"
    networks:
      - mongodb-network
    volumes:
      - config1-data:/data/db
    command:
      [
        "--configsvr",
        "--replSet",
        "configReplSet",
        "--bind_ip_all",
        "--port",
        "27017"
      ]
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')", "--port", "27017"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  configSrv2:
    image: mongo:latest
    container_name: configSrv2
    restart: always
    ports:
      - "27027:27017"
    networks:
      - mongodb-network
    volumes:
      - config2-data:/data/db
    command:
      [
        "--configsvr",
        "--replSet",
        "configReplSet",
        "--bind_ip_all",
        "--port",
        "27017"
      ]
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')", "--port", "27017"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  configSrv3:
    image: mongo:latest
    container_name: configSrv3
    restart: always
    ports:
      - "27037:27017"
    networks:
      - mongodb-network
    volumes:
      - config3-data:/data/db
    command:
      [
        "--configsvr",
        "--replSet",
        "configReplSet",
        "--bind_ip_all",
        "--port",
        "27017"
      ]
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')", "--port", "27017"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============ SHARD 1 REPLICA SET (3 реплики) ============
  shard1a:
    image: mongo:latest
    container_name: shard1a
    restart: always
    ports:
      - "27018:27018"
    networks:
      - mongodb-network
    volumes:
      - shard1a-data:/data/db
    command:
      [
        "--shardsvr",
        "--replSet",
        "shard1ReplSet",
        "--bind_ip_all",
        "--port",
        "27018"
      ]
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')", "--port", "27018"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  shard1b:
    image: mongo:latest
    container_name: shard1b
    restart: always
    ports:
      - "27028:27018"
    networks:
      - mongodb-network
    volumes:
      - shard1b-data:/data/db
    command:
      [
        "--shardsvr",
        "--replSet",
        "shard1ReplSet",
        "--bind_ip_all",
        "--port",
        "27018"
      ]
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')", "--port", "27018"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  shard1c:
    image: mongo:latest
    container_name: shard1c
    restart: always
    ports:
      - "27038:27018"
    networks:
      - mongodb-network
    volumes:
      - shard1c-data:/data/db
    command:
      [
        "--shardsvr",
        "--replSet",
        "shard1ReplSet",
        "--bind_ip_all",
        "--port",
        "27018"
      ]
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')", "--port", "27018"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============ SHARD 2 REPLICA SET (3 реплики) ============
  shard2a:
    image: mongo:latest
    container_name: shard2a
    restart: always
    ports:
      - "27019:27019"
    networks:
      - mongodb-network
    volumes:
      - shard2a-data:/data/db
    command:
      [
        "--shardsvr",
        "--replSet",
        "shard2ReplSet",
        "--bind_ip_all",
        "--port",
        "27019"
      ]
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')", "--port", "27019"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  shard2b:
    image: mongo:latest
    container_name: shard2b
    restart: always
    ports:
      - "27029:27019"
    networks:
      - mongodb-network
    volumes:
      - shard2b-data:/data/db
    command:
      [
        "--shardsvr",
        "--replSet",
        "shard2ReplSet",
        "--bind_ip_all",
        "--port",
        "27019"
      ]
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')", "--port", "27019"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  shard2c:
    image: mongo:latest
    container_name: shard2c
    restart: always
    ports:
      - "27039:27019"
    networks:
      - mongodb-network
    volumes:
      - shard2c-data:/data/db
    command:
      [
        "--shardsvr",
        "--replSet",
        "shard2ReplSet",
        "--bind_ip_all",
        "--port",
        "27019"
      ]
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')", "--port", "27019"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============ MONGOS ROUTER ============
  mongos_router:
    image: mongo:latest
    container_name: mongos_router
    restart: always
    ports:
      - "27020:27020"
    networks:
      - mongodb-network
    depends_on:
      - configSrv1
      - configSrv2
      - configSrv3
      - shard1a
      - shard2a
    command:
      [
        "mongos",
        "--configdb",
        "configReplSet/configSrv1:27017,configSrv2:27017,configSrv3:27017",
        "--bind_ip_all",
        "--port",
        "27020"
      ]
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')", "--port", "27020"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ============ FASTAPI APPLICATION ============
  pymongo_api:
    container_name: pymongo_api
    build: 
      context: api_app
      dockerfile: Dockerfile
    depends_on:
      mongos_router:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - mongodb-network
    environment:
      MONGODB_URL: "mongodb://mongos_router:27020"
      MONGODB_DATABASE_NAME: "somedb"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  mongodb-network:
    driver: bridge

volumes:
  config1-data:
  config2-data:
  config3-data:
  shard1a-data:
  shard1b-data:
  shard1c-data:
  shard2a-data:
  shard2b-data:
  shard2c-data: